# DigitalOcean App Platform spec. Database: Neon (free Postgres), see README.
# Create App from GitHub, then Settings → App Spec → Edit and paste this,
# replacing DATABASE_URL with the Neon connection string (direct, not pooled).
name: tasks-manager
region: fra
services:
  - name: web
    github:
      repo: zh0glikk/tasks-manager
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: postgresql://USER:PASSWORD@HOST.eu-central-1.aws.neon.tech/neondb?sslmode=require
      # Telegram bot + MCP (see README). The bot stays off until the token is set.
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: "123456:BOT_TOKEN_FROM_BOTFATHER"
      # optional: a chat allowed from the start; other chats are approved via /allow
      - key: TELEGRAM_CHAT_ID
        scope: RUN_TIME
        value: "-100XXXXXXXXXX"
      # optional: the chat that gets "class in 10 minutes / class started"; unset sends them to the admins
      - key: CLASS_REMINDERS_CHAT_ID
        scope: RUN_TIME
        value: "-5304357949"
      - key: TELEGRAM_ADMIN_IDS
        scope: RUN_TIME
        value: "YOUR_TELEGRAM_USER_ID"
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: https://clownfish-app-lpt6d.ondigitalocean.app
