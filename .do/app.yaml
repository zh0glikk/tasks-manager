# DigitalOcean App Platform spec.
# Create: Apps → Create App → GitHub → zh0glikk/tasks-manager (it picks this file up),
# or `doctl apps create --spec .do/app.yaml`.
name: tasks-manager
region: fra
services:
  - name: web
    github:
      repo: zh0glikk/tasks-manager
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /healthz
      initial_delay_seconds: 5
      period_seconds: 10
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
        scope: RUN_TIME
databases:
  - name: db
    engine: PG
    production: false
