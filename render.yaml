services:
  - type: web
    name: tasks-manager
    runtime: go
    plan: free
    buildCommand: go build -ldflags="-s -w" -o app ./cmd/server
    startCommand: ./app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tasks-manager-db
          property: connectionString

databases:
  - name: tasks-manager-db
    plan: free
    databaseName: tasks
    user: tasks
